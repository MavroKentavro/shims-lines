<h1 class="title">Shorts</h1><article class="piece"><p>Весенний узел –<br>не каждой змее суждено.<br>Мясо на трассе.</p></article>
<hr>
<article class="piece"><p>Пахнет арбузом<br>Море летнего дня<br>Сладкие пальцы</p></article>
<hr>
<article class="piece"><p>в любви перестал считать калории<br>фарш стекает по стенам, духовка на двести<br>как говорят адепты полиамории,<br>«снимай трусы-иди к невесте»</p></article>
